name: vectory

services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vectory

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.0.0}
    ports:
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - vectory

  kafka-init:
    image: ${KAFKA_IMAGE:-apache/kafka:4.0.0}
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        BS=kafka:9092
        create() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BS" --create --if-not-exists --topic "$$1" --partitions 1 --replication-factor 1
        }
        create posts.created
        create interactions.created
        create users.created
        echo "topics created:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BS" --list
    networks:
      - vectory

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    networks:
      - vectory

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-vectory-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "waiting for minio..."; sleep 2;
        done
        mc mb --ignore-existing "local/$$STORAGE_BUCKET"
        mc anonymous set none "local/$$STORAGE_BUCKET"
        echo "bucket ready: $$STORAGE_BUCKET (private)"
    networks:
      - vectory

  content-manager:
    build:
      context: ./content-manager
      args:
        JDK_IMAGE: ${JDK_IMAGE:-eclipse-temurin:25-jdk}
        JRE_IMAGE: ${JRE_IMAGE:-eclipse-temurin:25-jre}
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: content_manager
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Object storage (S3-compatible). Internal endpoint is used server-side
      # (HEAD checks); the public endpoint is baked into presigned URLs so the
      # browser can reach them directly.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-vectory-media}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      STORAGE_PATH_STYLE: ${STORAGE_PATH_STYLE:-true}
      STORAGE_PRESIGN_PUT_TTL: ${STORAGE_PRESIGN_PUT_TTL:-PT10M}
      STORAGE_PRESIGN_GET_TTL: ${STORAGE_PRESIGN_GET_TTL:-PT15M}
      STORAGE_MAX_IMAGE_BYTES: ${STORAGE_MAX_IMAGE_BYTES:-10485760}
      STORAGE_MAX_VIDEO_BYTES: ${STORAGE_MAX_VIDEO_BYTES:-104857600}
    ports:
      - "${CONTENT_MANAGER_PORT:-8080}:8080"
    networks:
      - vectory

  user-manager:
    build:
      context: ./user-manager
      args:
        JDK_IMAGE: ${JDK_IMAGE:-eclipse-temurin:25-jdk}
        JRE_IMAGE: ${JRE_IMAGE:-eclipse-temurin:25-jre}
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: user_manager
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL:-PT1H}
    ports:
      - "${USER_MANAGER_PORT:-8081}:8080"
    networks:
      - vectory

  recommendation-manager:
    build:
      context: ./recommendation-manager
      args:
        JDK_IMAGE: ${JDK_IMAGE:-eclipse-temurin:25-jdk}
        JRE_IMAGE: ${JRE_IMAGE:-eclipse-temurin:25-jre}
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: recommendation_manager
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com}
      EMBEDDING_PATH: ${EMBEDDING_PATH:-/v1/embeddings}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      USER_EMBEDDING_ALPHA: ${USER_EMBEDDING_ALPHA:-0.2}
      CRON_FIXED_DELAY: ${CRON_FIXED_DELAY:-PT5M}
      CRON_BATCH_SIZE: ${CRON_BATCH_SIZE:-500}
    networks:
      - vectory

networks:
  vectory:
    driver: bridge

volumes:
  pgdata:
  miniodata:
