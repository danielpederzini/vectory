spring:
  application:
    name: content-manager
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:content_manager}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
