spring:
  application:
    name: content-manager
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:content_manager}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

content-manager:
  outbox:
    poll-interval: ${OUTBOX_POLL_INTERVAL:PT1S}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:vectory-media}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    path-style-access: ${STORAGE_PATH_STYLE:true}
    presign:
      put-ttl: ${STORAGE_PRESIGN_PUT_TTL:PT10M}
      get-ttl: ${STORAGE_PRESIGN_GET_TTL:PT15M}
    upload:
      max-image-bytes: ${STORAGE_MAX_IMAGE_BYTES:10485760}
      allowed-image-content-types: ${STORAGE_ALLOWED_IMAGE_CONTENT_TYPES:image/jpeg,image/png,image/webp,image/gif}
